name: One-time Runtime Repair 3 cachefix reconciliation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-runtime3-cachefix.yml'
permissions:
  contents: write

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, 'Add one-time Runtime Repair 3 cachefix reconciliation')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconcile checksum manifest and integrity assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          sw = Path('sw.js')
          new_hash = hashlib.sha256(sw.read_bytes()).hexdigest()
          expected = '1477b2f2ec463c55b7b59be70a883a52a2446988f3ec281dee0a4419b14f919e'
          assert new_hash == expected, (new_hash, expected)

          manifest = Path('MANIFEST_SHA256.txt')
          raw = manifest.read_text()
          lines = raw.splitlines()
          hits = [i for i, line in enumerate(lines) if line.endswith('  sw.js')]
          assert len(hits) == 1, hits
          old_line = lines[hits[0]]
          assert old_line.startswith('0a42c0e392e2cfdafac7c3f9e10c47c378eca615e5566ce61a2d1b109d7a870a  '), old_line
          lines[hits[0]] = f'{new_hash}  sw.js'
          manifest.write_text('\n'.join(lines) + ('\n' if raw.endswith('\n') else ''))

          wf = Path('.github/workflows/real-engine-runtime-certification.yml')
          text = wf.read_text()
          old = 'assert "runtime-repair2-v4" in Path(\'sw.js\').read_text()'
          new = 'assert "runtime-repair3-cachefix-v1" in Path(\'sw.js\').read_text()'
          assert old in text
          wf.write_text(text.replace(old, new, 1))

          print('CACHEFIX MANIFEST RECONCILED', new_hash)
          PY
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST_SHA256.txt .github/workflows/real-engine-runtime-certification.yml
          git diff --cached --check
          git commit -m "Reconcile Runtime Repair 3 cachefix manifest"
          git push
