name: One-time DE Mentor shell freshness R7

on:
  push:
    paths:
      - '.github/workflows/one-time-de-shell-freshness-r7.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Option-B logo and harden shell freshness
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          V='20260912-r7'

          p=Path('index.html')
          s=p.read_text()
          replacements={
            'href="manifest.webmanifest"':f'href="manifest.webmanifest?v={V}"',
            'href="icon.svg"':f'href="icon.svg?v={V}"',
            'href="styles.css"':f'href="styles.css?v={V}"',
            'src="curriculum.js"':f'src="curriculum.js?v={V}"',
            'src="app.js"':f'src="app.js?v={V}"',
            '<div class="logo">DE</div>':f'<img class="logo" src="icon.svg?v={V}" alt="DE Mentor logo">',
          }
          for old,new in replacements.items():
            if old in s:
              s=s.replace(old,new,1)
          required=[f'manifest.webmanifest?v={V}',f'icon.svg?v={V}',f'styles.css?v={V}',f'curriculum.js?v={V}',f'app.js?v={V}',f'<img class="logo" src="icon.svg?v={V}" alt="DE Mentor logo">']
          for token in required:
            if token not in s:
              raise SystemExit(f'index repair token missing: {token}')
          p.write_text(s)

          p=Path('styles.css')
          s=p.read_text()
          old='.brandWrap{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:950;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow)}'
          new=f'.brandWrap{{display:flex;align-items:center;gap:10px;min-width:0}}.logo{{width:44px;height:44px;border-radius:14px;display:block;flex:0 0 44px;font-size:0;color:transparent;background:url("icon.svg?v={V}") center/cover no-repeat;box-shadow:var(--shadow)}}'
          if old in s:
            s=s.replace(old,new,1)
          if f'background:url("icon.svg?v={V}")' not in s:
            raise SystemExit('Option-B logo CSS was not restored')
          p.write_text(s)

          p=Path('app.js')
          s=p.read_text()
          old="navigator.serviceWorker.register('sw.js').catch(()=>{})"
          new=f"navigator.serviceWorker.register('sw.js?v={V}',{{updateViaCache:'none'}}).catch(()=>{{}})"
          if old in s:
            s=s.replace(old,new,1)
          if f"sw.js?v={V}" not in s or "updateViaCache:'none'" not in s:
            raise SystemExit('service-worker freshness registration missing')
          p.write_text(s)

          p=Path('manifest.webmanifest')
          m=json.loads(p.read_text())
          m['start_url']=f'./index.html?v={V}'
          for icon in m.get('icons',[]):
            src=str(icon.get('src',''))
            if src.split('?',1)[0]=='icon.svg':
              icon['src']=f'icon.svg?v={V}'
          p.write_text(json.dumps(m,indent=2)+"\n")

          p=Path('sw.js')
          s=p.read_text()
          s,n=re.subn(r"const CACHE=['\"][^'\"]+['\"];", "const CACHE='de-mentor-2026-rc5-strict-b01-shell-freshness-r7';", s, count=1)
          if n!=1:
            raise SystemExit('service-worker cache constant not found')
          p.write_text(s)

          Path('.github/workflows/one-time-de-shell-freshness-r7.yml').unlink()
          PY

      - name: Commit deterministic shell repair
        run: |
          git config user.name "Ashish Kumar"
          git config user.email "ashishjohnexx786@gmail.com"
          git add index.html styles.css app.js manifest.webmanifest sw.js .github/workflows/one-time-de-shell-freshness-r7.yml
          git diff --cached --check
          git commit -m "Restore Option B logo and harden DE Mentor shell R7"
          git push origin HEAD:main
