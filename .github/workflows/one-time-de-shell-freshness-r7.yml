name: One-time DE Mentor shell freshness R7

on:
  push:
    paths:
      - '.github/workflows/one-time-de-shell-freshness-r7.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shell references without touching learner data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          V='20260912-r7'

          p=Path('index.html')
          s=p.read_text()
          repl={
            'href="manifest.webmanifest"':f'href="manifest.webmanifest?v={V}"',
            'href="icon.svg"':f'href="icon.svg?v={V}"',
            'href="styles.css"':f'href="styles.css?v={V}"',
            'src="curriculum.js"':f'src="curriculum.js?v={V}"',
            'src="app.js"':f'src="app.js?v={V}"',
          }
          for old,new in repl.items():
            if old not in s:
              raise SystemExit(f'missing expected index token: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('styles.css')
          s=p.read_text()
          old='background:url("icon.svg") center/cover no-repeat'
          new=f'background:url("icon.svg?v={V}") center/cover no-repeat'
          if old not in s:
            raise SystemExit('missing expected current Option-B logo CSS')
          p.write_text(s.replace(old,new,1))

          p=Path('app.js')
          s=p.read_text()
          old="navigator.serviceWorker.register('sw.js').catch(()=>{})"
          new=f"navigator.serviceWorker.register('sw.js?v={V}',{{updateViaCache:'none'}}).catch(()=>{{}})"
          if old not in s:
            raise SystemExit('missing expected service-worker registration')
          p.write_text(s.replace(old,new,1))

          p=Path('manifest.webmanifest')
          m=json.loads(p.read_text())
          m['start_url']=f'./index.html?v={V}'
          for icon in m.get('icons',[]):
            if icon.get('src')=='icon.svg':
              icon['src']=f'icon.svg?v={V}'
          p.write_text(json.dumps(m,indent=2)+"\n")

          p=Path('sw.js')
          s=p.read_text()
          old="const CACHE='de-mentor-2026-rc5-strict-b01-runtime-repair3-cachefix-v1';"
          new="const CACHE='de-mentor-2026-rc5-strict-b01-shell-freshness-r7';"
          if old not in s:
            raise SystemExit('missing expected current cache constant')
          s=s.replace(old,new,1)
          for old_asset in ['styles.css','app.js','curriculum.js','curriculum.json','manifest.webmanifest','icon.svg']:
            quoted='"'+old_asset+'"'
            versioned='"'+old_asset+'?v='+V+'"'
            if quoted not in s:
              raise SystemExit(f'missing expected sw asset: {old_asset}')
            s=s.replace(quoted,versioned,1)
          p.write_text(s)

          Path('.github/workflows/one-time-de-shell-freshness-r7.yml').unlink()
          PY

      - name: Commit deterministic shell freshness repair
        run: |
          git config user.name "Ashish Kumar"
          git config user.email "ashishjohnexx786@gmail.com"
          git add index.html styles.css app.js manifest.webmanifest sw.js .github/workflows/one-time-de-shell-freshness-r7.yml
          git diff --cached --check
          git commit -m "Harden DE Mentor app-shell freshness R7"
          git push origin HEAD:main
