name: Runtime Repair 2 Hosted Parity Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare every learner-facing production file with live GitHub Pages bytes
        env:
          BASE_URL: https://ashishjohnexx786-dev.github.io/DE-Mentor-2026/
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, subprocess, time, urllib.parse, urllib.request

          base=os.environ['BASE_URL']
          exts={'.html','.js','.json','.webmanifest','.css','.svg','.png','.jpg','.jpeg','.pdf','.xlsx','.xlsm','.csv','.sql','.py','.ipynb','.zip','.txt'}
          paths=[]
          for p in subprocess.check_output(['git','ls-files'], text=True).splitlines():
              if p.startswith('.github/') or p in {'.gitattributes','.nojekyll','CNAME'}:
                  continue
              if os.path.splitext(p)[1].lower() in exts:
                  paths.append(p)
          assert paths, 'no production files selected'

          def sha(b): return hashlib.sha256(b).hexdigest()
          expected={p: sha(open(p,'rb').read()) for p in paths}
          remaining=set(paths)
          last={}
          for attempt in range(1,13):
              failed=set()
              for p in sorted(remaining):
                  url=base+urllib.parse.quote(p, safe='/')+f'?runtime2parity={attempt}-{int(time.time())}'
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'runtime2-parity-certifier'})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          data=r.read()
                      got=sha(data)
                      if got!=expected[p]:
                          failed.add(p); last[p]=(expected[p],got,len(data))
                  except Exception as e:
                      failed.add(p); last[p]=(expected[p],f'FETCH_ERROR:{e}',0)
              if not failed:
                  print(f'RUNTIME REPAIR 2 HOSTED PARITY PASS: {len(paths)}/{len(paths)} production learner-facing files exact')
                  for p in ['CURRENT_RELEASE.txt','service-worker.js','course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip']:
                      if p in expected: print('EXACT',p,expected[p])
                  raise SystemExit(0)
              print(f'attempt {attempt}: {len(failed)} mismatch(es) remain')
              remaining=failed
              time.sleep(10)
          print('FINAL MISMATCHES')
          for p in sorted(remaining): print(p,last[p])
          raise SystemExit(1)
          PY