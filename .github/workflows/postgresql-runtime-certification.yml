name: Standalone PostgreSQL Runtime Certification 2026
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgresql-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sde
          POSTGRES_PASSWORD: sde_runtime
          POSTGRES_DB: sde_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sde -d sde_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: sde
      PGPASSWORD: sde_runtime
      PGDATABASE: sde_runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Extract M07 canonical package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/m07 && mkdir -p /tmp/m07
          python - <<'PY'
          from pathlib import Path
          import zipfile
          zips=[p for p in Path('course_packages').rglob('*.zip') if 'M07' in p.name.upper() and 'G0' not in p.name.upper()]
          assert zips, 'M07 archive not found'
          z=sorted(zips)[0]
          print('M07_ARCHIVE',z)
          with zipfile.ZipFile(z) as f:
              assert f.testzip() is None
              f.extractall('/tmp/m07')
          PY
          find /tmp/m07 -type f -name '*.sql' -print | sort
      - name: Run canonical M07 PostgreSQL lab sequence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find /tmp/m07 -type f \( -name 'M07_01_NORMAL_SETUP_BUILD.sql' -o -name 'M07_02_TRANSACTIONS_UPSERT.sql' -o -name 'M07_03_INDEX_EXPLAIN.sql' -o -name 'M07_04_SCD2_LAB.sql' -o -name 'M07_05_FINAL_VALIDATION.sql' \) | sort)
          printf 'CANONICAL_SQL_FILES %s\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 5
          for f in "${files[@]}"; do
            echo "RUNNING $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Prove database remains queryable after canonical validation
        run: |
          psql -v ON_ERROR_STOP=1 -Atqc "select current_database(), current_user, current_setting('server_version');"
          echo 'STANDALONE M07 POSTGRESQL RUNTIME PASS'
