name: M09-M14 Engine Preflight Inspection 2026
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect engine-specific learner assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/engines && mkdir -p /tmp/engines
          python - <<'PY'
          from pathlib import Path
          import zipfile
          for module in ['M09','M10','M12','M13','M14']:
              hits=[p for p in Path('course_packages').rglob('*.zip') if module in p.name.upper() and 'G0' not in p.name.upper()]
              assert hits,module
              z=sorted(hits)[0]; out=Path('/tmp/engines')/module; out.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(z) as f:
                  assert f.testzip() is None,z
                  f.extractall(out)
              print('EXTRACTED',module,z)
          PY
          echo '=== M09 DBT PROJECT ==='
          find /tmp/engines/M09 -type f \( -name '*.sql' -o -name '*.yml' -o -name '*.yaml' -o -name '*.csv' -o -name '*.py' \) -print | sort
          while IFS= read -r f; do echo "----- $f -----"; sed -n '1,260p' "$f"; done < <(find /tmp/engines/M09 -type f \( -name '*.sql' -o -name '*.yml' -o -name '*.yaml' -o -name '*.py' \) | sort)
          echo '=== M10 AIRFLOW/DOCKER ==='
          while IFS= read -r f; do echo "----- $f -----"; sed -n '1,300p' "$f"; done < <(find /tmp/engines/M10 -type f \( -name '*.py' -o -name '*.yaml' -o -name '*.yml' -o -name 'Dockerfile' \) | sort)
          echo '=== M12 SPARK ==='
          while IFS= read -r f; do echo "----- $f -----"; sed -n '1,280p' "$f"; done < <(find /tmp/engines/M12 -type f \( -name '*reference*.py' -o -name 'test_transformations.py' -o -name 'requirements*.txt' \) | sort)
          echo '=== M13 DELTA ==='
          while IFS= read -r f; do echo "----- $f -----"; sed -n '1,280p' "$f"; done < <(find /tmp/engines/M13 -type f \( -name '*reference*.py' -o -name 'requirements*.txt' \) | sort)
          echo '=== M14 KAFKA ==='
          while IFS= read -r f; do echo "----- $f -----"; sed -n '1,320p' "$f"; done < <(find /tmp/engines/M14 -type f \( -name '*.py' -o -name '*.yaml' -o -name '*.yml' -o -name 'requirements*.txt' \) | sort)
