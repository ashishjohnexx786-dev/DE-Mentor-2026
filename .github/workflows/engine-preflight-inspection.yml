name: M09-M14 Engine Preflight Inspection 2026
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract M09-M14 and print runtime-relevant configs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/engines && mkdir -p /tmp/engines
          python - <<'PY'
          from pathlib import Path
          import zipfile
          for module in ['M09','M10','M11','M12','M13','M14']:
              hits=[p for p in Path('course_packages').rglob('*.zip') if module in p.name.upper() and 'G0' not in p.name.upper()]
              assert hits, module
              z=sorted(hits)[0]; out=Path('/tmp/engines')/module; out.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(z) as f:
                  assert f.testzip() is None
                  f.extractall(out)
              print('EXTRACTED',module,z)
          PY
          echo '=== RUNTIME FILE LIST ==='
          find /tmp/engines -type f \( -name '*.py' -o -name '*.yml' -o -name '*.yaml' -o -name 'requirements*.txt' -o -name 'Dockerfile' -o -name 'dbt_project.yml' -o -name 'profiles.yml' \) -print | sort
          echo '=== KEY CONFIG/SOURCE PREVIEWS ==='
          while IFS= read -r f; do
            echo "----- $f -----"
            sed -n '1,220p' "$f"
          done < <(find /tmp/engines -type f \( -name 'dbt_project.yml' -o -name 'profiles.yml' -o -name 'requirements*.txt' -o -name 'docker-compose.yml' -o -name 'compose.yml' -o -name '*reference*.py' -o -name 'test_transformations.py' -o -name '*dag*.py' -o -name 'producer.py' -o -name 'consumer.py' \) | sort)
