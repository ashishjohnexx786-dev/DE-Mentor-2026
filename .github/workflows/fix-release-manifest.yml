name: One-time Release Manifest Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-release-manifest.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile CURRENT_RELEASE checksum and verify manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest=Path('MANIFEST_SHA256.txt')
          target=Path('CURRENT_RELEASE.txt')
          actual=hashlib.sha256(target.read_bytes()).hexdigest()
          lines=manifest.read_text().splitlines()
          found=False
          out=[]
          for line in lines:
              if line.endswith('  CURRENT_RELEASE.txt'):
                  out.append(f'{actual}  CURRENT_RELEASE.txt')
                  found=True
              else:
                  out.append(line)
          assert found, 'CURRENT_RELEASE.txt missing from manifest'
          manifest.write_text('\n'.join(out)+'\n')
          for line in manifest.read_text().splitlines():
              if not line.strip():
                  continue
              h, rel=line.split('  ',1)
              p=Path(rel)
              assert p.is_file(), rel
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==h, (rel,got,h)
          print('MANIFEST RECONCILIATION PASS',actual)
          PY
          git config user.name 'Ashish Kumar'
          git config user.email 'ashishjohnexx786@gmail.com'
          if git diff --quiet -- MANIFEST_SHA256.txt; then
            echo 'Manifest already reconciled'
            exit 0
          fi
          git add MANIFEST_SHA256.txt
          git commit -m 'Reconcile Runtime Repair 2 release checksum manifest'
          git push origin HEAD:main