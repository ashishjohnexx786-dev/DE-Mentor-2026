name: Runtime Repair 2 Live Hosted Parity
on:
  push:
    branches: [runtime-candidate/real-engine-repair2-2026-09-12]
    paths: [control/RUNTIME_REPAIR2_LIVE_PARITY_TRIGGER.txt]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify production Pages exact bytes against Repair 2 product
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ashishjohnexx786-dev.github.io/DE-Mentor-2026/'
          files=(
            'CURRENT_RELEASE.txt'
            'MANIFEST_SHA256.txt'
            'sw.js'
            'control/SDE_RC5_RUNTIME_REPAIR2_REAL_ENGINE_DISCOVERY_2026-09-12.json'
            'course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip'
          )
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='e878b22a5182b28406de4aa89320551ff0512ff9f140d90f9b088bc30296f2ad'
          assert 'RUNTIME REPAIR 2 VERIFIED CANDIDATE' in Path('CURRENT_RELEASE.txt').read_text()
          assert 'runtime-repair2-v4' in Path('sw.js').read_text()
          PY
          pass=0
          for attempt in $(seq 1 40); do
            ok=1
            for f in "${files[@]}"; do
              mkdir -p "/tmp/live/$(dirname "$f")"
              curl -fsSL --retry 2 "${BASE}${f}?rr2=${GITHUB_SHA}-${attempt}" -o "/tmp/live/$f" || { ok=0; break; }
              [[ "$(sha256sum "$f" | awk '{print $1}')" == "$(sha256sum "/tmp/live/$f" | awk '{print $1}')" ]] || { ok=0; break; }
            done
            [[ "$ok" == 1 ]] && { pass=1; break; }
            sleep 10
          done
          test "$pass" == 1
          echo 'RUNTIME REPAIR 2 LIVE HOSTED BYTE PARITY PASS'
