name: Export Runtime Repair 2 M13
on:
  push:
    branches: [runtime-candidate/real-engine-repair2-2026-09-12]
    paths: [control/EXPORT_RUNTIME_REPAIR2_M13_TRIGGER.txt]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact M13 package
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          print(h)
          assert h=='e878b22a5182b28406de4aa89320551ff0512ff9f140d90f9b088bc30296f2ad'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-repair2-m13
          path: course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip
          if-no-files-found: error
