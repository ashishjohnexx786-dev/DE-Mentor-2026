name: Build Standalone Runtime Repair 2 Candidate
on:
  push:
    branches: [runtime-candidate/real-engine-repair2-2026-09-12]
    paths: [control/RUNTIME_REPAIR2_BUILD_TRIGGER.txt]
permissions:
  contents: write
jobs:
  build-repair2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build isolated M13/runtime successor bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile, tempfile, hashlib, json, shutil
          repo=Path('.')
          module=repo/'course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip'
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          predecessor='1c269bedaab3707979b4ed7625000e515aa14e8933daca9898521145eceba7f6'
          assert sha(module)==predecessor,(sha(module),predecessor)
          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              with zipfile.ZipFile(module,'r') as zin:
                  infos=zin.infolist()
                  zin.extractall(td)
              m13=td/'M13'
              script=m13/'04_LAB_ASSETS/delta_reference/delta_reference_lab.py'
              s=script.read_text()
              old="""builder=(SparkSession.builder.appName('M13DeltaLab').master('local[2]')
                       .config('spark.driver.memory','2g')
                       .config('spark.sql.shuffle.partitions','4'))
              spark=configure_spark_with_delta_pip(builder).getOrCreate()"""
              new="""builder=(SparkSession.builder.appName('M13DeltaLab').master('local[2]')
                       .config('spark.driver.memory','2g')
                       .config('spark.sql.shuffle.partitions','4')
                       .config('spark.sql.extensions','io.delta.sql.DeltaSparkSessionExtension')
                       .config('spark.sql.catalog.spark_catalog','org.apache.spark.sql.delta.catalog.DeltaCatalog'))
              spark=configure_spark_with_delta_pip(builder).getOrCreate()"""
              assert old in s,'expected pre-repair Delta builder block not found'
              script.write_text(s.replace(old,new))
              (m13/'04_LAB_ASSETS/delta_reference/RUN_ME_FIRST.txt').write_text(
                  'M13 first-use runtime: Java 17+; Python 3.10+; pip install -r requirements.txt. Then run: python delta_reference_lab.py\n'
                  'The reference script configures the Delta Spark SQL extension/catalog and Maven package automatically. If install/network/runtime fails, do not mark real Delta runtime complete.\n')
              def rels(exclude):
                  return sorted(str(p.relative_to(m13)).replace('\\\\','/') for p in m13.rglob('*') if p.is_file() and str(p.relative_to(m13)).replace('\\\\','/') not in exclude)
              # Rebuild the three pre-existing checksum controls with their predecessor exclusion contracts.
              index_path='CONTROL/M13_FILE_INDEX_SHA256.json'
              sums_path='CONTROL/SHA256SUMS.txt'
              manifest_path='CONTROL/MANIFEST_SHA256.txt'
              idx=[]
              for rel in rels({index_path,sums_path}):
                  p=m13/rel
                  idx.append({'path':rel,'bytes':p.stat().st_size,'sha256':sha(p)})
              (m13/index_path).write_text(json.dumps(idx,indent=2)+'\n')
              manifest_ex={index_path,'CONTROL/M13_MASTER_AUDIT_RC4_REPAIR_RECORD_2026-09-11.json','CONTROL/M13_POST_DEPLOY_SEMANTIC_REPAIR_RC5_2026-09-11.json',manifest_path,sums_path}
              (m13/manifest_path).write_text('\n'.join(f'{sha(m13/r)}  {r}' for r in rels(manifest_ex))+'\n')
              (m13/sums_path).write_text('\n'.join(f'{sha(m13/r)}  {r}' for r in rels({sums_path}))+'\n')
              # Repack using the predecessor entry order and ZipInfo metadata. This makes the successor deterministic.
              tmp=repo/'course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip.new'
              with zipfile.ZipFile(tmp,'w') as zout:
                  for info in infos:
                      data=b'' if info.is_dir() else (td/info.filename).read_bytes()
                      zout.writestr(info,data,compress_type=info.compress_type)
              with zipfile.ZipFile(tmp) as z: assert z.testzip() is None
              successor=sha(tmp)
              expected='46f9a4bddc2ccaa26abb1a3f4077813485f83968ea7b7fb4beb3085c80dc4f73'
              assert successor==expected,(successor,expected)
              tmp.replace(module)
          # Root runtime provenance/cache successor.
          (repo/'CURRENT_RELEASE.txt').write_text('''DE MENTOR - RC5 STRICT B01 RUNTIME REPAIR 2 VERIFIED CANDIDATE\nDate: 2026-09-12\nStatus: RUNTIME REPAIR 2 ISOLATED SUCCESSOR CANDIDATE; REAL-ENGINE PREFLIGHT PASS; HOSTED RE-PARITY + PHYSICAL DEVICE CONTINUATION PENDING - NOT FINAL\n\n20 stages - 264 formal lessons - 50 M18 project phases - 314 controlled units - 7 protected Gate families.\nM00-M14: 210 lessons retain the explicit B01-style 16-stage beginner-first teaching contract. Strict semantic pass remains inherited: 0 missing stages, 0 Picture-it/Vocabulary high-similarity lessons at >=0.55, 0 Expected/Validate recovery contamination, and 210/210 unique Why-it-worked texts.\nExternal-source lessons retain visible click actions plus printed URLs; book-led/internal lessons do not receive filler links.\nRoot learner-book aliases remain byte-identical to the matching module-package learner books; no learner PDF, curriculum registry, Gate, source map, progress-state schema, or Mentor route was changed by Runtime Repair 2.\n\nRuntime Repair 1 remains preserved in provenance: it corrected the learner-facing stale RC4 footer and bumped the installed-PWA shell cache.\nRuntime Repair 2 (2026-09-12): real Delta execution exposed that the packaged M13 reference script loaded delta-spark but did not configure DeltaSparkSessionExtension and DeltaCatalog. The isolated successor changes only the M13 Delta reference runtime setup plus its local run instruction/checksum controls. Real-engine preflight of this exact logic passed on Spark 4.2.0 + delta-spark 4.4.0. The root service-worker cache identity is bumped again so a previously cached canonical M13 package cannot survive the successor deployment.\n\nIndependent real-engine evidence now includes: M09 canonical ETL controls + dbt extension PASS; M10 Docker PASS; M10 Airflow 3.3 canonical DAG parse PASS; M12 PySpark PASS; M13 repaired Delta reference preflight PASS; M14 Kafka broker/producer/consumer PASS.\n\nNOT FINAL: the packaged Runtime Repair 2 bytes still require staged GitHub byte parity, real-engine re-run without in-run patching, hosted deployment/re-parity, physical Android continuation, learner-PC smoke, and any required external cloud/desktop evidence.\n''')
          sw=repo/'sw.js'
          txt=sw.read_text()
          old="const CACHE='de-mentor-2026-rc5-strict-b01-runtime-repair1-v3';"
          assert old in txt
          sw.write_text(txt.replace(old,"const CACHE='de-mentor-2026-rc5-strict-b01-runtime-repair2-v4';"))
          receipt={
            'artifact':'SDE_RC5_RUNTIME_REPAIR2_REAL_ENGINE_DISCOVERY_2026-09-12',
            'date':'2026-09-12','status':'STAGED_SUCCESSOR_CANDIDATE__NOT_FINAL',
            'trigger':{'workflow_run_id':34675961189,'m13_job_id':103505753198,'observed_failure':'DELTA_CONFIGURE_SPARK_SESSION_WITH_EXTENSION_AND_CATALOG at first Delta write','classification':'GENUINE_CANONICAL_M13_RUNTIME_DEFECT'},
            'repair':{'module_path':str(module),'predecessor_module_sha256':predecessor,'successor_module_sha256':sha(module),'runtime_change':'Add DeltaSparkSessionExtension and DeltaCatalog to the SparkSession builder before configure_spark_with_delta_pip(...).getOrCreate().','root_cache_from':'de-mentor-2026-rc5-strict-b01-runtime-repair1-v3','root_cache_to':'de-mentor-2026-rc5-strict-b01-runtime-repair2-v4'},
            'real_engine_evidence':{'preflight_run_id':34677101977,'m09_dbt_job':{'id':103508789008,'conclusion':'success'},'m10_docker_job':{'id':103508789026,'conclusion':'success'},'m12_spark_job':{'id':103508788875,'conclusion':'success'},'m13_delta_repair_preflight_job':{'id':103508789003,'conclusion':'success'},'m14_kafka_job':{'id':103508789018,'conclusion':'success'},'m10_airflow_dedicated_run':{'id':34677188025,'head_sha':'8b8938a04a18aac35e0c60b622baf287c75d37a6','conclusion':'success'}},
            'preserved_boundaries':['No learner PDF changed','No curriculum registry changed','No Gate changed','No source/video mapping changed','No Mentor route/progress-state logic changed','M00-M12 and M14-M19 module archives preserved byte-for-byte'],
            'remaining_before_promotion':['Verify staged byte parity','Run M13 real Delta directly from packaged successor with no in-run patch','Run regression checks','Promote only after PASS','Verify Pages/hosted parity','Resume physical Android certification'],
            'final':False
          }
          receipt_path=repo/'control/SDE_RC5_RUNTIME_REPAIR2_REAL_ENGINE_DISCOVERY_2026-09-12.json'
          receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
          # Preserve the existing root-manifest scope, add the new receipt, exclude MANIFEST itself and GitHub-only test controls.
          old_manifest=repo/'MANIFEST_SHA256.txt'
          tracked=[line.split('  ',1)[1] for line in old_manifest.read_text().splitlines() if line.strip()]
          if str(receipt_path.relative_to(repo)) not in tracked: tracked.append(str(receipt_path.relative_to(repo)))
          lines=[]
          for rel in sorted(set(tracked)):
              p=repo/rel
              assert p.is_file(),rel
              lines.append(f'{sha(p)}  {rel}')
          old_manifest.write_text('\n'.join(lines)+'\n')
          # Final product checks.
          assert sha(module)=='46f9a4bddc2ccaa26abb1a3f4077813485f83968ea7b7fb4beb3085c80dc4f73'
          assert "runtime-repair2-v4" in (repo/'sw.js').read_text()
          assert 'Beginner-First RC5 STRICT-B01' in (repo/'index.html').read_text()
          for line in old_manifest.read_text().splitlines():
              h,rel=line.split('  ',1); assert sha(repo/rel)==h,rel
          print('RUNTIME REPAIR2 PRODUCT BUILD PASS',sha(module),len(lines))
          PY
      - name: Commit exact product successor to staging branch
        run: |
          set -euo pipefail
          git config user.name 'Runtime Certification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add course_packages/modules/M13_DELTA_LAKEHOUSE_CANONICAL_MODULE_FREEZE_QA_PASS.zip CURRENT_RELEASE.txt sw.js MANIFEST_SHA256.txt control/SDE_RC5_RUNTIME_REPAIR2_REAL_ENGINE_DISCOVERY_2026-09-12.json
          git diff --cached --stat
          git commit -m 'Stage Standalone Runtime Repair 2 exact candidate [skip ci]'
          git push origin HEAD:runtime-candidate/real-engine-repair2-2026-09-12
