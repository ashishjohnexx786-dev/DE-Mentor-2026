name: Final Hosted Runtime Repair 2 Browser Certification
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: final-hosted-runtime2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Certify current hosted browser state
        shell: bash
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          mkdir -p /tmp/deep-downloads
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support.ui import Select

          base=os.environ['BASE_URL']; download_dir='/tmp/deep-downloads'
          sw_text=urllib.request.urlopen(base+'sw.js?finalqa='+os.environ.get('GITHUB_SHA',''),timeout=30).read().decode('utf-8')
          assert 'runtime-repair2-v4' in sw_text, 'live sw.js is not Runtime Repair 2 v4'
          o=webdriver.ChromeOptions(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=390,844')
          o.add_experimental_option('prefs',{'download.default_directory':download_dir,'download.prompt_for_download':False,'download.directory_upgrade':True})
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,30)
          def ready():
              w.until(lambda x:x.execute_script('return document.readyState')=='complete')
              w.until(lambda x:len(x.find_element(By.TAG_NAME,'body').text.strip())>40)
              time.sleep(.35)
          def severe(): return [x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
          def click(el): d.execute_script('arguments[0].click()',el)
          def close_extras():
              main=d.current_window_handle
              for h in list(d.window_handles):
                  if h!=main: d.switch_to.window(h); d.close()
              d.switch_to.window(main)
          try:
              d.get(base+'?finalqa='+os.environ.get('GITHUB_SHA','')); ready(); d.execute_script('localStorage.clear();location.reload()'); ready()
              for width,height in [(360,800),(390,844),(412,915),(768,1024),(1280,900)]:
                  d.set_window_size(width,height); time.sleep(.12)
                  assert d.execute_script('return document.documentElement.scrollWidth')<=d.execute_script('return innerWidth')+4, f'overflow at {width}'
              d.set_window_size(390,844)
              tabs=d.find_elements(By.CSS_SELECTOR,'.tab[data-view], nav button[data-view], #nav button[data-tab]'); used=0
              for b in tabs[:12]:
                  try:
                      if b.is_displayed() and b.is_enabled(): click(b); time.sleep(.07); used+=1
                  except Exception: pass
              assert used>=5, f'only {used} nav controls usable'; assert not severe(), severe()
              assert d.execute_script("localStorage.setItem('__final_runtime2','ok');return localStorage.getItem('__final_runtime2')")=='ok'
              d.refresh(); ready(); assert d.execute_script("return localStorage.getItem('__final_runtime2')")=='ok'
              settings=d.find_elements(By.CSS_SELECTOR,'#settingsBtn'); theme=d.find_elements(By.CSS_SELECTOR,'#themeInput'); save=d.find_elements(By.CSS_SELECTOR,'#saveSettingsBtn'); original=None
              if settings and theme and save:
                  click(settings[0]); time.sleep(.15); assert 'amoled' in [x.get_attribute('value') for x in theme[0].find_elements(By.TAG_NAME,'option')]
                  Select(theme[0]).select_by_value('amoled'); click(save[0]); time.sleep(.2)
                  assert d.execute_script("return document.body.dataset.theme||document.documentElement.dataset.theme||''")=='amoled'
                  d.refresh(); ready(); assert d.execute_script("return document.body.dataset.theme||document.documentElement.dataset.theme||''")=='amoled'; original='amoled'
              study=d.find_elements(By.CSS_SELECTOR,'#studyStartEnd')
              if study:
                  click(study[0]); time.sleep(1.2); d.refresh(); ready(); study=d.find_elements(By.CSS_SELECTOR,'#studyStartEnd'); assert study and ('END' in study[0].text.upper() or 'STOP' in study[0].text.upper()); click(study[0])
              learn=d.find_elements(By.CSS_SELECTOR,'.tab[data-view="learn"], nav button[data-view="learn"], #nav button[data-tab="Learn"]')
              if learn: click(learn[0]); time.sleep(.2)
              review=d.find_elements(By.CSS_SELECTOR,'#reviewBtn, button[data-action="review"], button[data-act="review"]')
              if review:
                  assert not review[0].is_enabled(); learner=d.find_elements(By.CSS_SELECTOR,'#learnerPackBtn'); guided=d.find_elements(By.CSS_SELECTOR,'#guidedDoneBtn'); attempt=d.find_elements(By.CSS_SELECTOR,'#saveAttemptBtn')
                  if learner and guided and attempt:
                      click(learner[0]); time.sleep(.35); close_extras(); guided=d.find_elements(By.CSS_SELECTOR,'#guidedDoneBtn'); attempt=d.find_elements(By.CSS_SELECTOR,'#saveAttemptBtn'); click(guided[0]); click(attempt[0]); time.sleep(.2)
                      review=d.find_elements(By.CSS_SELECTOR,'#reviewBtn, button[data-action="review"], button[data-act="review"]'); assert review and review[0].is_enabled()
              export_btn=d.find_elements(By.CSS_SELECTOR,'#exportJsonBtn'); restore=d.find_elements(By.CSS_SELECTOR,'#restoreFile')
              if export_btn and restore:
                  for p in Path(download_dir).glob('*'): p.unlink()
                  click(export_btn[0]); backup=None
                  for _ in range(50):
                      fs=[p for p in Path(download_dir).glob('*.json') if p.is_file()]
                      if fs: backup=max(fs,key=lambda p:p.stat().st_mtime); break
                      time.sleep(.1)
                  assert backup and backup.stat().st_size>20; parsed=json.loads(backup.read_text(encoding='utf-8')); assert isinstance(parsed,dict) and parsed
                  if original=='amoled':
                      d.execute_script("for(const k of Object.keys(localStorage)){try{let v=JSON.parse(localStorage.getItem(k));if(v&&typeof v==='object'&&v.theme){v.theme='light';localStorage.setItem(k,JSON.stringify(v));}}catch(e){}}")
                      d.refresh(); ready()
                  d.find_elements(By.CSS_SELECTOR,'#restoreFile')[0].send_keys(str(backup)); time.sleep(.6)
                  if original=='amoled': assert d.execute_script("return document.body.dataset.theme||document.documentElement.dataset.theme||''")=='amoled'
              sw=d.execute_async_script("""const done=arguments[0];const t=setTimeout(()=>done({ok:false,why:'timeout'}),15000);navigator.serviceWorker.ready.then(r=>{clearTimeout(t);done({ok:!!r.active,script:r.active?r.active.scriptURL:''})}).catch(e=>{clearTimeout(t);done({ok:false,why:String(e)})});""")
              assert sw.get('ok'),sw; d.refresh(); ready(); assert d.execute_script('return !!navigator.serviceWorker.controller')
              d.execute_cdp_cmd('Network.enable',{}); d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':True,'latency':0,'downloadThroughput':0,'uploadThroughput':0}); d.refresh(); time.sleep(1)
              assert len(d.find_element(By.TAG_NAME,'body').text.strip())>40
              d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':False,'latency':0,'downloadThroughput':-1,'uploadThroughput':-1}); d.refresh(); ready(); assert not severe(), severe()
              print('FINAL RUNTIME2 HOSTED BROWSER PASS',base,'nav',used,'sw',sw.get('script',''))
          finally:
              try:d.execute_cdp_cmd('Network.emulateNetworkConditions',{'offline':False,'latency':0,'downloadThroughput':-1,'uploadThroughput':-1})
              except Exception:pass
              d.quit()
          PY
